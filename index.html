<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 晨读小花园</title>
    <style>
        /* 核心配色：粉嫩马卡龙 */
        :root {
            --bg: #FFF0F5;          /* 浅樱花粉背景 */
            --card: #FFFFFF;        /* 纯白卡片 */
            --pink-dark: #F48FB1;   /* 深粉，用于标题和边框 */
            --pink-light: #FCE4EC;  /* 浅粉，用于按钮和点击反馈 */
            --text: #4A4A4A;        /* 深灰色字体，比纯黑柔和 */
            --subtext: #9E9E9E;     /* 浅灰，用于拼音 */
            --blue: #81D4FA;        /* 点缀的浅蓝 */
            --green: #A5D6A7;       /* 点缀的浅绿 */
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            box-sizing: border-box;
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        /* 登录 & 家长端 (保持基础逻辑，换上粉色系) */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .login-box { background: var(--card); padding: 30px 20px; border-radius: 24px; box-shadow: 0 8px 24px rgba(244,143,177,0.15); width: 100%; max-width: 320px; text-align: center; }
        .login-box h2 { margin-top: 0; color: var(--pink-dark); }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid var(--pink-light); border-radius: 12px; font-size: 18px; text-align: center; box-sizing: border-box; outline:none;}
        .login-box input:focus { border-color: var(--pink-dark); }
        .login-btn { width: 100%; padding: 12px; background: var(--pink-dark); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; }

        .admin-panel { background: #FFF8E1; padding: 15px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 2px dashed #FFCA28; }
        .admin-panel h3 { margin-top: 0; color: #E65100; }
        .admin-row { display: flex; gap: 8px; margin-bottom: 15px; align-items: center; flex-wrap: wrap;}
        .admin-row input { width: 50px; padding: 8px; text-align: center; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .btn { border: none; padding: 10px 16px; border-radius: 12px; font-weight: bold; font-size: 15px; color: white; cursor: pointer; }
        .btn-save { background: var(--pink-dark); }
        .btn-logout { background: #BDBDBD; float: right; padding: 6px 12px; font-size: 14px;}
        
        /* 历史记录与校验列表 */
        .history-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; background: #fff; border-radius: 8px; overflow: hidden;}
        .history-table th, .history-table td { border: 1px solid var(--pink-light); padding: 8px; }
        .history-table th { background: var(--pink-light); color: var(--pink-dark); }
        .edit-list { max-height: 350px; overflow-y: auto; background: #fff; border-radius: 8px; padding: 10px;}
        .edit-item { border-bottom: 1px solid #eee; padding: 12px 0; display: flex; justify-content: space-between; align-items: center;}
        .btn-blue { background: var(--blue); padding: 6px 12px; font-size: 14px;}

        #editModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: flex-end; }
        .modal-content { background: #fff; width: 100%; height: 90%; border-radius: 24px 24px 0 0; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h3 { margin: 0; color: var(--pink-dark); }
        .modal-label { font-size: 14px; font-weight: bold; color: #888; margin-bottom: 5px; margin-top: 10px;}
        .modal-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; font-family: inherit; box-sizing: border-box; margin-bottom: 10px; }
        .modal-textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; font-family: inherit; box-sizing: border-box; flex: 1; resize: none; }
        .modal-footer { display: flex; gap: 10px; margin-top: 15px; }
        .modal-footer .btn { flex: 1; padding: 12px; font-size: 16px; }
        .btn-cancel { background: #E0E0E0; color: #666; }
        .btn-confirm { background: var(--pink-dark); }

        /* ================= 孩子端界面 ================= */
        
        /* 主页 */
        #homeScreen { display: none; flex-direction: column; gap: 20px; justify-content: center; height: 85vh; padding: 0 20px;}
        .header h1 { color: var(--pink-dark); font-size: 36px; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(244,143,177,0.2);}
        .big-btn { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 35%; border-radius: 32px; color: white; font-size: 42px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.08); cursor: pointer; transition: transform 0.1s; }
        .big-btn:active { transform: scale(0.97); }
        .btn-chinese { background: linear-gradient(135deg, #F48FB1, #F06292); }
        .btn-english { background: linear-gradient(135deg, #81D4FA, #4FC3F7); }
        .btn-loop { background: linear-gradient(135deg, #424242, #212121); height: 18%; font-size: 28px;}
        .big-btn span { font-size: 20px; font-weight: normal; margin-top: 10px; opacity: 0.9;}

        /* 专注阅读页 (横屏优化) */
        #readingScreen { display: none; flex-direction: column; flex: 1; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 10px;}
        .btn-back { background: transparent; border: none; font-size: 22px; color: var(--pink-dark); font-weight: bold; cursor: pointer; }
        .progress-badge { background: var(--pink-light); color: var(--pink-dark); padding: 6px 16px; border-radius: 20px; font-size: 18px; font-weight: bold;}
        
        .focus-card { background: var(--card); border-radius: 32px; padding: 30px 40px; box-shadow: 0 12px 32px rgba(244,143,177,0.1); display: flex; flex-direction: column; flex: 1; position: relative;}
        .focus-title { font-size: 32px; font-weight: bold; color: var(--pink-dark); text-align: center; margin-bottom: 30px; border-bottom: 2px dashed var(--pink-light); padding-bottom: 15px;}
        
        /* 横屏内容区：两列排版 */
        .focus-content { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-content: center; overflow-y: auto; padding: 10px;}
        
        .line-block { text-align: center; cursor: pointer; padding: 15px; border-radius: 16px; transition: all 0.1s; background: #FAFAFA;}
        .line-block:active { background-color: var(--pink-light); transform: scale(0.98);}
        
        /* 字超大 */
        .line-pinyin { font-size: 20px; color: var(--pink-dark); margin-bottom: 8px; letter-spacing: 2px; opacity: 0.8;}
        .line-text { font-size: 42px; font-weight: bold; color: var(--text); line-height: 1.4; }
        
        .bottom-action { margin-top: 20px; display: flex; flex-direction: row; gap: 20px; justify-content: center;}
        .btn-record { background: #FFB74D; color: white; border: none; padding: 16px 40px; border-radius: 20px; font-size: 24px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 6px 12px rgba(255,183,77,0.3);}
        .btn-record.recording { background: var(--danger); animation: pulse 1s infinite; }
        .btn-next { background: var(--pink-dark); color: white; border: none; padding: 16px 40px; border-radius: 20px; font-size: 24px; font-weight: bold; display: none; cursor: pointer; box-shadow: 0 6px 12px rgba(244,143,177,0.3);}
        
        .status-text { font-size: 20px; font-weight: bold; text-align: center; padding: 12px; border-radius: 12px; background: #FFF8E1; color: #E65100; display: none; cursor: pointer; margin-bottom: 15px;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* 英语专属 */
        .en-line { font-size: 38px; font-weight: bold; color: #333; margin-bottom: 10px; cursor: pointer; text-align: center; background:#FAFAFA; padding: 15px; border-radius: 16px;}
        .en-trans { font-size: 20px; color: #888; margin-bottom: 20px; text-align: center;}
        .word-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 20px;}
        .word-card { background: #E3F2FD; border: 3px solid var(--blue); border-radius: 20px; padding: 10px 24px; font-size: 32px; font-weight: bold; color: #1565C0; cursor: pointer;}
        .phonics-list { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;}
        .phonics-item { background: #E8F5E9; border-radius: 12px; padding: 10px 20px; font-size: 28px; font-weight: bold; color: #2E7D32; cursor: pointer;}

        /* 循环播放模式 (黑屏极度省电) */
        #loopScreen { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #000; color: #333; text-align: center; position: fixed; top:0; left:0; width:100%; z-index: 1001;}
        .loop-icon { font-size: 80px; color: #111; margin-bottom: 20px; animation: pulse 3s infinite;}
        .loop-text { font-size: 24px; color: #222; margin-bottom: 60px; padding: 0 20px; line-height: 1.5;}
        .btn-stop-loop { background: #222; color: #666; border: none; padding: 20px 60px; border-radius: 40px; font-size: 20px; font-weight: bold; cursor: pointer;}
        
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- 登录 -->
    <div id="loginScreen">
        <div class="login-box">
            <h2>🌸 晨读小花园</h2>
            <p style="color:#999; font-size:14px;">孩子：1234 / 家长：8888</p>
            <input type="password" id="pwdInput" placeholder="输入密码">
            <button class="login-btn" onclick="handleLogin()">进入</button>
        </div>
    </div>

    <!-- 家长端 -->
    <div id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">修改课文</h3>
                <button class="btn btn-cancel" style="padding:4px 8px;" onclick="closeModal()">关闭</button>
            </div>
            <div class="modal-label">标题：</div>
            <input type="text" id="editTitle" class="modal-input">
            <div class="modal-label">拼音：</div>
            <textarea id="editPinyin" class="modal-input" style="height: 80px; resize:none;"></textarea>
            <div class="modal-label">正文（汉字）：</div>
            <textarea id="editContent" class="modal-textarea"></textarea>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn btn-confirm" onclick="saveTaskEdit()">💾 保存修改</button>
            </div>
        </div>
    </div>

    <div id="parentScreen" style="display: none;">
        <div class="admin-panel">
            <button class="btn btn-logout" onclick="logout()">退出</button>
            <h3>👩‍🏫 家长控制台</h3>
            <div class="admin-row">
                <span>进度：第</span>
                <input type="number" id="setWeek" value="1">
                <span>周，第</span>
                <input type="number" id="setDay" value="1">
                <span>天</span>
                <button class="btn btn-save" onclick="saveSettings()">修改</button>
            </div>
        </div>
        <div class="admin-panel" style="background:#E3F2FD; border-color:#64B5F6;">
            <h3 style="color:#1565C0;">📊 孩子打卡记录</h3>
            <table class="history-table" id="historyTable">
                <thead><tr><th>日期</th><th>已读篇数</th><th>状态</th></tr></thead>
                <tbody id="historyBody"><tr><td colspan="3">加载中...</td></tr></tbody>
            </table>
        </div>
        <div class="admin-panel" style="background:#FFF; border:2px solid var(--pink-dark);">
            <h3 style="color:var(--pink-dark);">📝 内容校验与修改</h3>
            <button class="btn btn-blue" onclick="loadEditList()">刷新本周列表</button>
            <div class="edit-list" id="editListContainer"></div>
        </div>
    </div>

    <!-- 孩子端主页 -->
    <div id="homeScreen">
        <div class="header" style="text-align:center;">
            <h1>🌸 每日晨读</h1>
            <p id="subtitle" style="font-weight:bold; color:#999; font-size:20px;">加载中...</p>
        </div>
        <div class="big-btn btn-chinese" onclick="openReading('语文')">
            📖 语文晨读
            <span>点开进入大屏阅读</span>
        </div>
        <div class="big-btn btn-english" onclick="openReading('英语')">
            🔤 英语复习
            <span>Words & Phonics</span>
        </div>
        <div class="big-btn btn-loop" onclick="startLoopMode()">
            🎧 循环磨耳朵
        </div>
        <button class="btn btn-logout" style="margin-top:20px; align-self:center;" onclick="logout()">退出登录</button>
    </div>

    <!-- 孩子端阅读页 -->
    <div id="readingScreen">
        <div class="top-nav">
            <button class="btn-back" onclick="backToHome()">← 返回</button>
            <div class="progress-badge" id="readingProgress">0 / 0</div>
        </div>
        
        <div class="focus-card">
            <div class="focus-title" id="focusTitle">加载中...</div>
            <div class="focus-content" id="focusContent"></div>
            
            <div class="status-text" id="statusText" onclick="playLastRecord()">🔊 点我重听录音</div>
            
            <div class="bottom-action">
                <button class="btn-record" id="btnRecord" onclick="toggleRecord()">
                    🎤 录音跟读
                </button>
                <button class="btn-next" id="btnNext" onclick="nextTask()">
                    确认读完，下一篇 →
                </button>
            </div>
        </div>
    </div>

    <!-- 循环磨耳朵 -->
    <div id="loopScreen">
        <div class="loop-icon">🎧</div>
        <div class="loop-text" id="loopStatus">正在准备音频...</div>
        <button class="btn-stop-loop" onclick="stopLoopMode()">退出磨耳朵</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://mubucjoyklpxoobgjyva.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11YnVjam95a2xweG9vYmdqeXZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mzc4MDMsImV4cCI6MjEwMzIxMzgwM30.YfnUWqXIcnGY99Qbvz3vDIPnFf9ECC9M0dbM40cCr8k';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userRole = localStorage.getItem('morning_role'); 
        let currentWeek = 1, currentDay = 1;
        let todayTasks = [];
        let currentTaskIndex = 0;
        let editingTaskId = null;
        let currentSubject = '语文'; 
        let currentExtraTasks = [];

        // ================= 发音 =================
        let globalAudio = new Audio(); 
        function speak(text, lang = 'zh-CN', event) {
            if (event) event.preventDefault(); 
            globalAudio.pause();
            globalAudio.currentTime = 0;
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            if (lang === 'en-US') {
                let cleanText = text.replace(/[.,!?;:'"]/g, '').trim();
                const audioUrl = `https://dict.youdao.com/dictvoice?le=en&audio=${encodeURIComponent(cleanText)}&type=2`;
                globalAudio.src = audioUrl;
                globalAudio.play().catch(err => fallbackSpeak(text, lang));
            } else {
                fallbackSpeak(text, lang);
            }
        }

        function fallbackSpeak(text, lang) {
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = (lang === 'en-US') ? 0.8 : 0.85;
            const voices = synth.getVoices();
            const targetVoice = voices.find(v => v.lang.includes(lang));
            if (targetVoice) utterance.voice = targetVoice;
            synth.speak(utterance);
        }

        function getTodayDate() {
            const d = new Date();
            return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
        }

        function handleLogin() {
            const pwd = document.getElementById('pwdInput').value;
            if (pwd === '8888' || pwd === '1234') {
                userRole = pwd === '8888' ? 'parent' : 'child';
                localStorage.setItem('morning_role', userRole);
                initApp();
            } else { alert('密码错误！'); }
        }

        function logout() { localStorage.removeItem('morning_role'); location.reload(); }

        async function initApp() {
            document.getElementById('loginScreen').style.display = 'none';
            const { data: setting } = await db.from('morning_settings').select('*').eq('id', 1).single();
            if (setting) { currentWeek = setting.current_week; currentDay = setting.current_day; }
            
            let dayName = currentDay === 7 ? '第7天' : `第${currentDay}天`;
            document.getElementById('subtitle').innerText = `进度：第 ${currentWeek} 周 · ${dayName}`;

            if (userRole === 'parent') {
                document.getElementById('parentScreen').style.display = 'block';
                document.getElementById('setWeek').value = currentWeek;
                document.getElementById('setDay').value = currentDay;
                loadEditList(); loadHistory();
            } else {
                document.getElementById('homeScreen').style.display = 'flex';
            }
        }

        // --- 家长端逻辑 ---
        async function saveSettings() {
            const w = parseInt(document.getElementById('setWeek').value);
            const d = parseInt(document.getElementById('setDay').value);
            await db.from('morning_settings').update({ current_week: w, current_day: d }).eq('id', 1);
            alert('进度已更新！'); location.reload(); 
        }

        async function loadHistory() {
            const tbody = document.getElementById('historyBody');
            const { data: records } = await db.from('morning_records').select('read_date, task_id');
            if (!records) { tbody.innerHTML = '<tr><td colspan="3">加载失败</td></tr>'; return; }
            const summary = {};
            records.forEach(r => { if (!summary[r.read_date]) summary[r.read_date] = new Set(); summary[r.read_date].add(r.task_id); });
            const dates = Object.keys(summary).sort((a, b) => new Date(b) - new Date(a)).slice(0, 10);
            if (dates.length === 0) { tbody.innerHTML = '<tr><td colspan="3">暂无打卡记录</td></tr>'; return; }
            tbody.innerHTML = '';
            dates.forEach(date => {
                const count = summary[date].size;
                let statusIcon = count >= 3 ? '✅ 已打卡' : '⚠️ 未完';
                tbody.innerHTML += `<tr><td>${date}</td><td><strong>${count}</strong> 篇</td><td style="color:${count>=3?'green':'orange'}">${statusIcon}</td></tr>`;
            });
        }

        async function loadEditList() {
            const w = parseInt(document.getElementById('setWeek').value);
            const container = document.getElementById('editListContainer');
            container.innerHTML = '加载中...';
            const { data: tasks } = await db.from('morning_book').select('*').eq('week', w).order('day_index', { ascending: true });
            if(!tasks || tasks.length === 0) { container.innerHTML = '暂无数据'; return; }
            container.innerHTML = '';
            tasks.forEach(task => {
                container.innerHTML += `<div class="edit-item"><div style="flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; margin-right:10px;"><strong>${task.day_index}.</strong> ${task.title}</div><button class="btn btn-blue" onclick="openModal(${task.id})">修改</button></div>`;
            });
        }

        async function openModal(taskId) {
            editingTaskId = taskId;
            const { data: task } = await db.from('morning_book').select('*').eq('id', taskId).single();
            if(!task) return;
            document.getElementById('modalTitle').innerText = `修改：${task.title}`;
            document.getElementById('editTitle').value = task.title;
            document.getElementById('editPinyin').value = task.pinyin || '';
            document.getElementById('editContent').value = task.content || '';
            document.getElementById('editModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('editModal').style.display = 'none'; editingTaskId = null; }
        async function saveTaskEdit() {
            if (!editingTaskId) return;
            const title = document.getElementById('editTitle').value;
            const pinyin = document.getElementById('editPinyin').value;
            const content = document.getElementById('editContent').value;
            const btn = document.querySelector('.btn-confirm');
            btn.innerText = '保存中...';
            const { error } = await db.from('morning_book').update({ title, pinyin, content }).eq('id', editingTaskId);
            if (error) alert('保存失败'); else { alert('修改成功！'); closeModal(); loadEditList(); }
            btn.innerText = '💾 保存修改';
        }

        // ================= 孩子端逻辑 =================
        function backToHome() {
            document.getElementById('readingScreen').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'flex';
        }

        async function openReading(subject) {
            currentSubject = subject;
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('readingScreen').style.display = 'flex';
            
            document.getElementById('focusTitle').innerText = '正在准备...';
            document.getElementById('focusContent').innerHTML = '';
            document.getElementById('statusText').style.display = 'none';
            document.getElementById('btnRecord').style.display = 'none';
            document.getElementById('btnNext').style.display = 'none';

            if (subject === '语文') {
                currentExtraTasks = [];
                let maxIndex = currentDay >= 7 ? 9 : currentDay + 2;
                const { data: tasks } = await db.from('morning_book').select('*').eq('week', currentWeek).lte('day_index', maxIndex).order('day_index', { ascending: true });
                if (!tasks || tasks.length === 0) { alert('暂无内容'); backToHome(); return; }
                
                const today = getTodayDate();
                const { data: records } = await db.from('morning_records').select('*').eq('read_date', today);
                const recordMap = {}; if(records) records.forEach(r => recordMap[r.task_id] = r);

                todayTasks = tasks.filter(task => {
                    let target = (currentDay < 7 && task.day_index >= currentDay) ? 2 : 1;
                    return (!recordMap[task.id] || recordMap[task.id].read_count < target);
                });

                if (todayTasks.length === 0) { await advanceProgress(); return; }
                todayTasks.forEach(task => {
                    task._targetCount = (currentDay < 7 && task.day_index >= currentDay) ? 2 : 1;
                    task._currentCount = recordMap[task.id] ? recordMap[task.id].read_count : 0;
                    task._recordId = recordMap[task.id] ? recordMap[task.id].id : null;
                });
                currentTaskIndex = 0;
                renderChineseTask();

            } else if (subject === '英语') {
                const today = getTodayDate();
                const { data: exTasks } = await db.from('morning_english_extra').select('*').like('study_dates', `%${today}%`);
                currentExtraTasks = exTasks || [];

                const { data: engTasks } = await db.from('morning_english').select('*').eq('day_index', currentDay).limit(1);
                
                if (!engTasks || engTasks.length === 0) { 
                    if (currentExtraTasks.length === 0) { alert(`暂无英语内容`); backToHome(); return; }
                    else { todayTasks = []; }
                } else {
                    todayTasks = engTasks;
                }
                currentTaskIndex = 0;
                renderEnglishTask();
            }
        }

        // --- 渲染语文 (横屏断句) ---
        function renderChineseTask() {
            const task = todayTasks[currentTaskIndex];
            document.getElementById('readingProgress').innerText = `${currentTaskIndex + 1} / ${todayTasks.length}`;
            document.getElementById('focusTitle').innerText = task.title;

            // 🎯 强制按标点符号断句
            let sentences = task.content.split(/(?<=[。！？；])/g).filter(s => s.trim().length > 0);
            
            // 处理拼音的分割（简单按空格和标点对应）
            let pinyins = task.pinyin ? task.pinyin.split(/(?<=[.?!;])/g).filter(s => s.trim().length > 0) : [];

            let html = '';
            sentences.forEach((sentence, index) => {
                const clean = sentence.trim(); if(!clean) return;
                const py = pinyins[index] ? pinyins[index].trim() : '';
                html += `
                <div class="line-block" onclick="speak('${clean.replace(/'/g, "\\'")}', 'zh-CN', event)">
                    ${py ? `<div class="line-pinyin">${py}</div>` : ''}
                    <div class="line-text">${clean}</div>
                </div>`;
            });
            document.getElementById('focusContent').innerHTML = html;
            resetBottomButtons();
        }

        // --- 渲染英语 ---
        function renderEnglishTask() {
            let html = '';
            if (todayTasks.length > 0) {
                const task = todayTasks[currentTaskIndex];
                document.getElementById('readingProgress').innerText = `Day ${task.day_index}`;
                document.getElementById('focusTitle').innerText = task.unit_title;
                html += generateEnglishHtml(task, false);
            }

            currentExtraTasks.forEach((ex, idx) => {
                html += `<div style="grid-column: 1 / -1; text-align:center; color:var(--pink-dark); font-weight:bold; margin-top:20px;">✨ 复习：${ex.unit_title}</div>`;
                html += generateEnglishHtml(ex, true);
            });
            
            document.getElementById('focusContent').innerHTML = html;
            resetBottomButtons();
        }

        function generateEnglishHtml(task, isExtra) {
            const sentenceList = task.sentences.split('|').map(s => s.trim());
            const transList = task.translation ? task.translation.split('|').map(t => t.trim()) : [];
            const wordsArray = task.words ? task.words.split(',').map(w => w.trim()) : [];
            const phonicsArray = task.phonics ? task.phonics.split(',').map(p => p.trim()) : [];
            const fullText = sentenceList.join('. ');

            let res = `<div style="grid-column: 1 / -1;">`;
            res += `<button class="btn-record" style="width:100%; background:#81D4FA; margin-bottom:20px;" onclick="speak('${fullText.replace(/'/g, "\\'")}', 'en-US', event)">▶️ 播放全文朗读</button>`;
            
            sentenceList.forEach((s, i) => {
                res += `
                    <div class="en-line" onclick="speak('${s.replace(/'/g, "\\'")}', 'en-US', event)">${s}</div>
                    <div class="en-trans">${transList[i] || ''}</div>
                `;
            });
            res += `</div>`;

            if(wordsArray.length > 0) {
                res += `<div style="grid-column: 1 / -1; text-align:center; color:var(--pink-dark); font-weight:bold; margin-top:20px;">重点单词</div>`;
                wordsArray.forEach(w => {
                    const pureWord = w.replace(/[^\x00-\x7F]/g, "").trim(); 
                    const emoji = w.replace(/[a-zA-Z\s]/g, "").trim();
                    res += `
                    <div class="word-card" onclick="speak('${pureWord}', 'en-US', event)" style="margin: 0 auto;">
                        <span>${pureWord}</span><span>${emoji}</span>
                    </div>`;
                });
            }
            return res;
        }

        function resetBottomButtons() {
            const recBtn = document.getElementById('btnRecord');
            const nextBtn = document.getElementById('btnNext');
            const statusText = document.getElementById('statusText');
            
            recBtn.innerText = '🎤 录音跟读';
            recBtn.classList.remove('recording');
            recBtn.style.display = 'flex';
            recBtn.style.margin = '0 auto';
            
            nextBtn.style.display = 'none';
            statusText.style.display = 'none';
            isRecording = false;
        }

        // --- 录音功能 ---
        let mediaRecorder, audioChunks = [], isRecording = false;
        let recordedBlob = null; 

        function playLastRecord() {
            if (recordedBlob) {
                const tempAudio = new Audio(URL.createObjectURL(recordedBlob));
                tempAudio.play().catch(e => console.log('播放录音失败', e));
                const statusText = document.getElementById('statusText');
                statusText.innerText = '🔊 正在播放...';
                setTimeout(() => { statusText.innerText = '🔊 点我重听录音'; }, 1500);
            }
        }

        async function toggleRecord() {
            const btn = document.getElementById('btnRecord');
            const statusText = document.getElementById('statusText');
            const nextBtn = document.getElementById('btnNext');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };
                    mediaRecorder.onstop = () => {
                        recordedBlob = new Blob(audioChunks, { type: 'audio/webm' }); 
                        new Audio(URL.createObjectURL(recordedBlob)).play(); 
                        
                        btn.innerText = '🎤 重新录音';
                        btn.classList.remove('recording');
                        btn.style.display = 'none'; // 录完了先隐藏
                        
                        statusText.innerText = '🔊 点我重听录音';
                        statusText.style.display = 'block'; 
                        nextBtn.style.display = 'flex';
                        nextBtn.style.margin = '0 auto';
                        stream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.innerText = '🛑 点击停止';
                    btn.classList.add('recording');
                    statusText.style.display = 'none';
                    nextBtn.style.display = 'none';
                } catch (err) { alert('无法访问麦克风！'); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
            }
        }

        async function nextTask() {
            if (currentSubject === '语文') {
                const task = todayTasks[currentTaskIndex];
                const today = getTodayDate();
                const newCount = task._currentCount + 1;
                if (task._recordId) await db.from('morning_records').update({ read_count: newCount }).eq('id', task._recordId);
                else await db.from('morning_records').insert([{ task_id: task.id, read_count: newCount, read_date: today }]);

                if (newCount < task._targetCount) {
                    task._currentCount = newCount;
                    document.getElementById('statusText').innerText = `还需读 ${task._targetCount - newCount} 遍哦。`;
                    document.getElementById('statusText').style.display = 'block';
                    document.getElementById('btnRecord').style.display = 'flex';
                    document.getElementById('btnRecord').innerText = '🎤 再读一遍';
                    document.getElementById('btnNext').style.display = 'none';
                    return;
                }
                currentTaskIndex++;
                if (currentTaskIndex >= todayTasks.length) await advanceProgress();
                else renderChineseTask();
            } else {
                alert('🎉 英语跟读完成！');
                backToHome();
            }
        }

        async function advanceProgress() {
            let newWeek = currentWeek;
            let newDay = currentDay + 1;
            if (newDay > 7) { newWeek = currentWeek + 1; newDay = 1; }
            await db.from('morning_settings').update({ current_week: newWeek, current_day: newDay }).eq('id', 1);
            alert(`🎉 太棒了！任务已完成！\n已解锁：第 ${newWeek} 周 · 第 ${newDay} 天`);
            location.reload();
        }

        // ================= 🎧 黑屏磨耳朵 =================
        let loopQueue = [];
        let isLooping = false;

        async function startLoopMode() {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('loopScreen').style.display = 'flex';
            document.getElementById('loopStatus').innerText = '正在准备音频...';
            
            loopQueue = [];
            const today = getTodayDate();

            const { data: engTasks } = await db.from('morning_english').select('*').eq('day_index', currentDay).limit(1);
            if (engTasks && engTasks.length > 0) {
                loopQueue.push(engTasks[0].sentences.replace(/\|/g, '. '));
            }
            const { data: exTasks } = await db.from('morning_english_extra').select('*').like('study_dates', `%${today}%`);
            if (exTasks) {
                exTasks.forEach(t => { loopQueue.push(t.sentences.replace(/\|/g, '. ')); });
            }

            if (loopQueue.length === 0) { alert('暂无英语内容'); stopLoopMode(); return; }
            isLooping = true;
            playLoopQueue();
        }

        function playLoopQueue() {
            if (!isLooping) return;
            let index = 0;
            function playNext() {
                if (!isLooping) return;
                if (index >= loopQueue.length) {
                    document.getElementById('loopStatus').innerText = '一轮完毕，3秒后重播...';
                    setTimeout(() => { if(isLooping) { index = 0; playNext(); } }, 3000);
                    return;
                }
                const text = loopQueue[index];
                document.getElementById('loopStatus').innerText = text;
                let cleanText = text.replace(/[.,!?;:'"]/g, '').trim();
                globalAudio.src = `https://dict.youdao.com/dictvoice?le=en&audio=${encodeURIComponent(cleanText)}&type=2`;
                globalAudio.onended = () => { index++; setTimeout(playNext, 1500); };
                globalAudio.play().catch(() => { index++; playNext(); });
            }
            playNext();
        }

        function stopLoopMode() {
            isLooping = false;
            globalAudio.pause();
            document.getElementById('loopScreen').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'flex';
        }

        window.onload = () => {
            if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
            if (userRole) initApp();
        };
    </script>
</body>
</html>
